<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlists — Indiefferential</title>
<meta name="description" content="Curated playlists from Indiefferential — electronic, hip-hop, alternative and late-night listening.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0a0a%22/><text x=%2250%25%22 y=%2262%22 font-size=%2260%22 fill=%22%23d6ff3f%22 text-anchor=%22middle%22 font-family=%22Arial%22>i</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-root="">

<div class="grain"></div>
<div class="cursor-dot"></div>
<div class="cursor-ring"></div>
<div class="scroll-progress"></div>

<div class="loader">
  <div class="vinyl"></div>
  <div class="loader-label">Loading Playlists</div>
</div>

<header class="site-header" data-include="header.html"></header>

<main>

  <section class="page-hero">
    <div class="container">
      <div class="eyebrow" data-reveal="fade">Listen</div>
      <h1 class="page-hero-title" data-reveal>Playlists</h1>
      <p class="page-hero-desc" data-reveal>Hand-curated, no algorithm. Updated weekly across Spotify, Apple Music and SoundCloud.</p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="grid grid-3">
        <div class="card" data-reveal data-play-track data-track-title="Night Circuit Radio" data-track-artist="Various Artists" data-track-art="https://picsum.photos/seed/pl1/300/300">
          <div class="playlist-cover"><img src="https://picsum.photos/seed/pl1/500/500" alt="">
            <div class="card-play" style="opacity:1; transform:translate(-50%,-50%) scale(1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l14 8-14 8V4z"/></svg></div>
          </div>
          <div class="card-body card-outside">
            <div class="card-meta"><span>42 tracks</span><span>·</span><span>Electronic</span></div>
            <div class="card-title">Night Circuit Radio</div>
          </div>
        </div>
        <div class="card" data-reveal data-delay="80" data-play-track data-track-title="Basement Bars" data-track-artist="Various Artists" data-track-art="https://picsum.photos/seed/pl2/300/300">
          <div class="playlist-cover"><img src="https://picsum.photos/seed/pl2/500/500" alt="">
            <div class="card-play" style="opacity:1; transform:translate(-50%,-50%) scale(1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l14 8-14 8V4z"/></svg></div>
          </div>
          <div class="card-body card-outside">
            <div class="card-meta"><span>36 tracks</span><span>·</span><span>Hip-Hop</span></div>
            <div class="card-title">Basement Bars</div>
          </div>
        </div>
        <div class="card" data-reveal data-delay="160" data-play-track data-track-title="Slow Wave" data-track-artist="Various Artists" data-track-art="https://picsum.photos/seed/pl3/300/300">
          <div class="playlist-cover"><img src="https://picsum.photos/seed/pl3/500/500" alt="">
            <div class="card-play" style="opacity:1; transform:translate(-50%,-50%) scale(1);"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M7 4l14 8-14 8V4z"/></svg></div>
          </div>
          <div class="card-body card-outside">
            <div class="card-meta"><span>28 tracks</span><span>·</span><span>Alt / Indie</span></div>
            <div class="card-title">Slow Wave</div>
          </div>
        </div>
      </div>

      <div style="margin-top:60px;" data-reveal>
        <div class="eyebrow" style="margin-bottom:18px;">Spotify</div>
        <iframe class="embed-frame" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify playlist"></iframe>
      </div>

      <div style="margin-top:44px;" data-reveal>
        <div class="eyebrow" style="margin-bottom:18px;">SoundCloud</div>
        <iframe class="embed-frame" width="100%" height="166" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/discover&color=%23d6ff3f&auto_play=false&show_user=true" title="SoundCloud embed"></iframe>
      </div>

      <div style="margin-top:44px;" data-reveal>
        <div class="eyebrow" style="margin-bottom:18px;">YouTube</div>
        <iframe class="embed-frame" width="100%" height="420" src="https://www.youtube.com/embed/videoseries?list=PLrEnWoR732-BHrPp_Pm8_VleD68f9s14-" title="YouTube playlist" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer" data-include="footer.html"></footer>
<div class="mini-player" data-include="player.html"></div>
<script src="js/main.js"></script>
</body>
</html>
